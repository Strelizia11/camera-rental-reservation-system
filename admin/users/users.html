<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users | Admin</title>
  <link rel="stylesheet" href="../../shared/global.css">
  <link rel="stylesheet" href="../admin.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main>
      <h1>Users</h1>
      <div class="toolbar">
        <input type="text" id="search" placeholder="Search by name or email...">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Contact Number</th><th>Email</th><th>Actions</th></tr></thead>
          <tbody id="userBody"></tbody>
        </table>
      </div>
      <div class="pager" id="pager"></div>
    </main>
  </div>

  <!-- Previous Transactions dialog. It sits OUTSIDE <main> on purpose, so no page layout rule can offset or clip it. -->
  <div class="history-overlay" id="modal">
    <div class="history-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="history-header">
        <h2 id="modalTitle"></h2>
        <button type="button" class="edit-close" id="closeModal" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l12 12M15 3L3 15"/></svg>
        </button>
      </header>
      <div class="history-body" id="modalBody"></div>
    </div>
  </div>

  <script src="../../shared/data.js"></script>
  <script src="../layout.js"></script>
  <script src="script.js"></script>
</body>
</html>
