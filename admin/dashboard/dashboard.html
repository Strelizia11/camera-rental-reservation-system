<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Admin</title>
  <link rel="stylesheet" href="../../shared/global.css">
  <link rel="stylesheet" href="../admin.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main>
      <h1>Dashboard</h1>
      <div class="cards">
        <div class="card"><div class="label">Total Users</div><div class="value" id="totalUsers"></div></div>
        <div class="card"><div class="label">Total Devices</div><div class="value" id="totalDevices"></div></div>
        <div class="card"><div class="label">Total Reservations</div><div class="value" id="totalReservations"></div></div>
        <div class="card"><div class="label">Total Revenue</div><div class="value" id="totalRevenue"></div></div>
      </div>
      <h3>Latest Reservations</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Renter</th><th>Device(s)</th><th>Start - End</th><th>Total</th></tr></thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="../../shared/data.js"></script>
  <script src="../layout.js"></script>
  <script src="script.js"></script>
</body>
</html>
