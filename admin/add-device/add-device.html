<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Device | Admin</title>
  <link rel="stylesheet" href="../../shared/global.css">
  <link rel="stylesheet" href="../admin.css">
</head>
<body>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main>
      <h1>Add Device</h1>
      <div class="message" id="message"></div>
      <form id="deviceForm" class="panel">
        <h3>Basic Info</h3>
        <div class="form-grid">
          <div class="field"><label for="brand">Brand</label><input id="brand" name="brand" required></div>
          <div class="field"><label for="model">Model</label><input id="model" name="model" required></div>
          <div class="field"><label for="category">Category</label><select id="category" name="category" required></select></div>
          <div class="field"><label for="price">Price per day</label>
            <div class="input-unit"><span class="pre">₱</span><input id="price" name="price" type="number" min="1" required><span class="unit">/ day</span></div></div>
          <div class="field"><label for="images">Device images</label><input id="images" type="file" accept="image/*" multiple required><div class="preview" id="imagesPreview"></div></div>
          <div class="field"><label for="samples">Sample shots</label><input id="samples" type="file" accept="image/*" multiple><div class="preview" id="samplesPreview"></div></div>
        </div>

        <div id="specsSection" class="hidden">
          <h3 id="specsTitle"></h3>
          <div id="specsBox" class="form-grid"></div>
        </div>

        <button type="submit" class="btn-primary submit-btn">Add Device</button>
      </form>
    </main>
  </div>
  <script src="../../shared/data.js"></script>
  <script src="../layout.js"></script>
  <script src="../specs.js"></script>
  <script src="script.js"></script>
</body>
</html>
