<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArkiLente</title>
    <link rel="stylesheet" href="shared/global.css">
    <link rel="stylesheet" href="login/style.css">
    <script src="shared/data.js" defer></script>
    <script src="shared/ui.js" defer></script>
    <script src="login/script.js" defer></script>
</head>
<body>
    <main class="landing">
        <div class="landing-art" aria-hidden="true">
            <div class="circle circle-1"><img src="shared/circles/Circle1.jpg" alt="" onerror="this.remove()"></div>
            <div class="circle circle-2"><img src="shared/circles/Circle2.jpg" alt="" onerror="this.remove()"></div>
            <div class="circle circle-3"><img src="shared/circles/Circle3.jpg" alt="" onerror="this.remove()"></div>
        </div>

        <div class="landing-content">
            <h1 class="brand">ArkiLente</h1>
            <p class="baybayin" lang="tl-Tglg">ᜀᜇ᜔ᜃᜒᜎᜒᜈ᜔ᜆᜒ</p>
            <p class="tagline">Camera Rental Reservations</p>
            <div class="landing-buttons">
                <button type="button" id="openSignIn" class="btn-primary">Sign in</button>
                <button type="button" id="openSignUp">Sign up</button>
            </div>
        </div>
    </main>

    <div id="signUpModal" class="modal hidden">
        <div class="modal-box">
            <button type="button" class="modal-x" id="closeSignUp" aria-label="Close">&times;</button>
            <h2>Sign up</h2>
            <form id="signUpForm" novalidate>
                <label for="signUpName">Full name</label>
                <input type="text" id="signUpName" autocomplete="name" placeholder="Enter your name">
                <div id="signUpNameError" class="errors"></div>

                <label for="signUpEmail">Email</label>
                <input type="email" id="signUpEmail" autocomplete="email" placeholder="user@email.com">
                <div id="signUpEmailError" class="errors"></div>

                <label for="signUpContact">Contact number</label>
                <input type="tel" id="signUpContact" autocomplete="tel" placeholder="09123456789 or +6391234567" >
                <div id="signUpContactError" class="errors"></div>

                <label for="signUpPassword">Password</label>
                <input type="password" id="signUpPassword" autocomplete="new-password" placeholder="Enter your password">
                <div id="signUpPasswordError" class="errors"></div>

                <label for="signUpConfirm">Confirm Password</label>
                <input type="password" id="signUpConfirm" autocomplete="new-password" placeholder="Confirm your password">
                <div id="signUpConfirmError" class="errors"></div>

                <div class="terms-row">
                    <input type="checkbox" id="signUpTerms">
                    <label for="signUpTerms">I agree to the Terms and Agreement</label>
                </div>
                <div id="signUpTermsError" class="errors"></div>

                <div class="modal-actions">
                    <button type="submit" id="signUpBtn" class="btn-primary">Sign up</button>
                </div>
            </form>
            <p class="switch-text">Already have an account? <a href="#" id="toSignIn">Sign in</a></p>
        </div>
    </div>

    <div id="signInModal" class="modal hidden">
        <div class="modal-box">
            <button type="button" class="modal-x" id="closeSignIn" aria-label="Close">&times;</button>
            <h2>Sign in</h2>
            <form id="signInForm" novalidate>
                <label for="signInEmail">Email</label>
                <input type="email" id="signInEmail" autocomplete="email" placeholder="user@email.com">
                <div id="signInEmailError" class="errors"></div>

                <label for="signInPassword">Password</label>
                <input type="password" id="signInPassword" autocomplete="current-password" placeholder="Enter your password">
                <div id="signInPasswordError" class="errors"></div>

                <div>
                    <button type="submit" id="signInBtn" class="btn-primary">Sign in</button>
                </div>
            </form>
            <p class="switch-text">No account yet? <a href="#" id="toSignUp">Sign up</a></p>
        </div>
    </div>
</body>
</html>
